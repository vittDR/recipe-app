name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared logic tests
        run: npm run test:logic
      - name: Database migrations and rules
        run: npm run test:sql
      - name: Seed library is up to date with recipes.json
        run: node scripts/build-seed-library.ts && git diff --exit-code supabase/seed_library.sql
      - name: Web app typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build
