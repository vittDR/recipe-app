# Free Supabase projects pause after a week without activity. One small
# request a day keeps DINEAMITE awake. Uses the public (publishable) key only.
name: Keep Supabase awake
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database API
        run: |
          curl -fsS "https://grvkstzctekisscvfroy.supabase.co/rest/v1/ingredient_catalog?select=name&limit=1" \
            -H "apikey: sb_publishable_BkHrEudRfB1j5MlMogL8Dw_h1LPe3xL" > /dev/null
